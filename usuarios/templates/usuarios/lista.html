<!DOCTYPE html>
<html>
<head>
    <title>Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

    <h1 class="mb-4">Lista de Usuarios</h1>

    <a href="/crear/" class="btn btn-primary mb-3">➕ Crear usuario</a>

    <ul class="list-group">
        {% for usuario in usuarios %}
            <li class="list-group-item d-flex justify-content-between align-items-center">
                {{ usuario.nombre }}
                <div>
                    <a href="/editar/{{ usuario.id }}" class="btn btn-warning btn-sm">Editar</a>
                    <a href="/eliminar/{{ usuario.id }}" class="btn btn-danger btn-sm">Eliminar</a>
                </div>
            </li>
        {% empty %}
            <li class="list-group-item">No hay usuarios</li>
        {% endfor %}
    </ul>

</body>
</html>
